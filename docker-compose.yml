version: '3.8'

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: hailmary-timescaledb
    environment:
      POSTGRES_USER: hailmary
      POSTGRES_PASSWORD: password
      POSTGRES_DB: hailmary
    ports:
      - "5433:5432"
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: hailmary-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: always

volumes:
  timescaledb-data:
  redis-data:
